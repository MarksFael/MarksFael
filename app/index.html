<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toxina Botulínica — App (protótipo)</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--fg:#1f2937;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--soft:#eef2ff;--warn-bg:#fff7ed;--warn-line:#fdba74;
--code-bg:#fee2e2;--code-fg:#b91c1c;--ok:#16a34a;}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.62;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:12px;padding:10px 16px}
header .brand{font-weight:700;font-size:15px;white-space:nowrap}
header .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
#search{flex:1;max-width:520px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.menu{display:none}
.progress{font-size:12px;color:var(--muted);white-space:nowrap}
.progress b{color:var(--accent)}
.layout{display:flex;gap:0;max-width:1240px;margin:0 auto}
aside{flex:0 0 290px;border-right:1px solid var(--line);background:var(--panel);
height:calc(100vh - 57px);position:sticky;top:57px;overflow-y:auto;padding:14px 12px}
aside .quick{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid #c7d2fe;
color:#3730a3;font-weight:600;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:12px}
.grp{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--fg);
text-decoration:none;font-size:14px;cursor:pointer}
.nav a:hover{background:var(--soft)}
.nav a.active{background:var(--accent);color:#fff}
.nav a .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 auto}
.nav a.done .dot{background:var(--ok)}
.nav a.active .dot{background:#fff}
.nav a.hidden{display:none}
main{flex:1;min-width:0;padding:26px 36px 90px}
article{max-width:780px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 38px}
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
h1.t{font-size:25px;margin:0 0 14px}
.markme{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;
border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin-bottom:18px}
.markme.on{background:#dcfce7;border-color:#86efac;color:#15803d}
.content :is(h2,h3){scroll-margin-top:70px}
.content h2{font-size:21px;margin:26px 0 10px}
.content h3{font-size:18px;margin:20px 0 8px;color:#374151}
.content p{margin:9px 0}
.content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.content th,.content td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.content th{background:var(--soft)}
.content tr:nth-child(even) td{background:#fafafa}
.content blockquote{margin:14px 0;padding:11px 15px;background:var(--warn-bg);border-left:4px solid var(--warn-line);
border-radius:0 8px 8px 0;color:#7c2d12}
.content code{background:var(--code-bg);color:var(--code-fg);padding:1px 6px;border-radius:5px;font-size:13px;font-weight:600}
.content ul,.content ol{padding-left:22px}.content hr{border:none;border-top:1px solid var(--line);margin:22px 0}
mark{background:#fde68a;padding:0 2px;border-radius:3px}
.nextprev{display:flex;justify-content:space-between;gap:10px;margin-top:24px;max-width:780px}
.nextprev button{flex:1;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;cursor:pointer}
.nextprev button:last-child{text-align:right}.nextprev button:disabled{opacity:.4;cursor:default}
.nextprev small{display:block;color:var(--muted);font-size:11px}
.cards{display:grid;gap:16px;max-width:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.card h3{margin:0 0 10px;font-size:17px}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card ul{margin:0;padding-left:20px}.card li{margin:5px 0}
.qlink{display:inline-block;margin:5px 8px 0 0;background:var(--soft);border:1px solid #c7d2fe;color:#3730a3;
border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer}
.empty{color:var(--muted);padding:20px}
@media(max-width:880px){.btn.menu{display:block}
aside{position:fixed;left:0;top:57px;z-index:30;transform:translateX(-105%);transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.15)}
aside.open{transform:translateX(0)}
main{padding:18px 14px 80px}article{padding:20px 18px}header .brand small{display:none}}
</style></head><body>
<header>
<button class="btn menu" id="menuBtn">☰</button>
<div class="brand">Toxina Botulínica<small>protótipo — visual neutro</small></div>
<input id="search" placeholder="Buscar (doses, músculos, marcas…)">
<span class="progress" id="prog"></span>
</header>
<div class="layout">
<aside id="aside">
<button class="quick" id="quickBtn">⚡ Consulta rápida</button>
<div class="nav" id="nav"></div>
</aside>
<main id="main"></main>
</div>
<script id="data" type="application/json">{"pages": [{"id": "inicio", "title": "Início", "part": "", "html": "<blockquote>\n<p><strong>Origem:</strong> texto extraído via OCR de 108 screenshots (IMG_2319–2426) de um vídeo\nque apresenta páginas do ebook de Toxina Botulínica (autoria atribuída a\n<strong>Tiago Drummond de Assis</strong>). O ebook original tem ~236 páginas; estes prints\ncobrem parte delas, fora de ordem. O conteúdo abaixo foi reorganizado por tema.</p>\n<p><strong>⚠️ Revisão clínica obrigatória:</strong> o OCR pode ter cortado ou embaralhado\n<strong>números, doses, unidades e temperaturas</strong>. Nada foi inventado — trechos\nincertos estão marcados com <code>[revisar]</code> ou <code>[...]</code>. Confira todos os valores\ncontra o material original antes de qualquer uso/publicação.</p>\n</blockquote>\n<hr />", "text": " \n  Origem:  texto extraído via OCR de 108 screenshots (IMG_2319–2426) de um vídeo\nque apresenta páginas do ebook de Toxina Botulínica (autoria atribuída a\n Tiago Drummond de Assis ). O ebook original tem ~236 páginas; estes prints\ncobrem parte delas, fora de ordem. O conteúdo abaixo foi reorganizado por tema. \n  ⚠️ Revisão clínica obrigatória:  o OCR pode ter cortado ou embaralhado\n números, doses, unidades e temperaturas . Nada foi inventado — trechos\nincertos estão marcados com  [revisar]  ou  [...] . Confira todos os valores\ncontra o material original antes de qualquer uso/publicação. \n \n "}, {"id": "01-1-1-unidades-americanas-e-unidades-speyw", "title": "1.1 Unidades Americanas e Unidades Speywood", "part": "Parte 1 — Farmacologia e unidades", "html": "<p>As unidades na toxina botulínica referem-se a medidas padronizadas usadas para\nquantificar a atividade biológica da toxina. Essas medidas ajudam a determinar a\ndosagem apropriada para diferentes aplicações médicas e estéticas. As duas mais\ncomuns são as <strong>Unidades Americanas</strong> e as <strong>Unidades Speywood</strong>.</p>\n<ul>\n<li>Usam <strong>unidades Americanas</strong>: Botulift, Xeomin, Botox, Nabota, Botulim e Prosigne.</li>\n<li>Usa <strong>unidade Speywood</strong>: Dysport.</li>\n</ul>", "text": " As unidades na toxina botulínica referem-se a medidas padronizadas usadas para\nquantificar a atividade biológica da toxina. Essas medidas ajudam a determinar a\ndosagem apropriada para diferentes aplicações médicas e estéticas. As duas mais\ncomuns são as  Unidades Americanas  e as  Unidades Speywood . \n \n Usam  unidades Americanas : Botulift, Xeomin, Botox, Nabota, Botulim e Prosigne. \n Usa  unidade Speywood : Dysport. \n "}, {"id": "02-1-2-convers-o-da-dysport", "title": "1.2 Conversão da Dysport", "part": "Parte 1 — Farmacologia e unidades", "html": "<p>As unidades de TBA <strong>não são intercambiáveis</strong>. Diversos autores apontam que a\nmelhor conversão entre Unidades Americanas × Speywood seria <strong>1:2,5</strong> — ou seja, a\ncada 1 unidade de Botox/Nabota teríamos 2,5 unidades de Dysport.</p>\n<ul>\n<li>1 unidade americana = 2,5 unidades Speywood</li>\n<li>Dysport 300 unidades ≈ 120 unidades americanas</li>\n<li>Dysport 500 unidades ≈ 200 unidades americanas</li>\n</ul>", "text": " As unidades de TBA  não são intercambiáveis . Diversos autores apontam que a\nmelhor conversão entre Unidades Americanas × Speywood seria  1:2,5  — ou seja, a\ncada 1 unidade de Botox/Nabota teríamos 2,5 unidades de Dysport. \n \n 1 unidade americana = 2,5 unidades Speywood \n Dysport 300 unidades ≈ 120 unidades americanas \n Dysport 500 unidades ≈ 200 unidades americanas \n "}, {"id": "03-1-3-halo-de-a-o", "title": "1.3 Halo de ação", "part": "Parte 1 — Farmacologia e unidades", "html": "<p>O \"halo de ação\" refere-se à área ao redor do ponto de injeção que também\nexperimenta efeito paralisante, pois a toxina se espalha de forma limitada a\npartir do ponto de aplicação. É um conceito importante no planejamento: os efeitos\npodem afetar áreas vizinhas, então deve-se considerar como o halo influencia o\nresultado final.</p>", "text": " O \"halo de ação\" refere-se à área ao redor do ponto de injeção que também\nexperimenta efeito paralisante, pois a toxina se espalha de forma limitada a\npartir do ponto de aplicação. É um conceito importante no planejamento: os efeitos\npodem afetar áreas vizinhas, então deve-se considerar como o halo influencia o\nresultado final. "}, {"id": "04-1-4-a-dysport-mais-potente-ou-tem-maior-", "title": "1.4 A Dysport é mais potente ou tem maior halo de ação?", "part": "Parte 1 — Farmacologia e unidades", "html": "<p>Inúmeros pesquisadores apontam que a Dysport <strong>não</strong> se difunde mais nem é mais\npotente que as demais marcas. Para resultado equivalente, ela precisa ser usada na\nequivalência correta (<strong>2,5:1</strong>). Quando se usa equivalência maior (4:1 ou 3:1),\nnaturalmente há aumento do halo e da potência, pois se entrega mais TBA. Quanto ao\nhalo de ação, há quase um consenso de que o <strong>Xeomin</strong> tem halo menor que as demais.</p>\n<p><strong>Estudo HIS:</strong> comparou o diâmetro do halo de inibição da sudorese (HIS) de 5 TBA\ncomerciais, em cinco doses, ao longo de 6 meses. Concluiu que quanto maior o número\nde unidades, maior o HIS para todas. Botox, Botulift, Dysport e Prosigne\napresentaram HIS semelhantes; <strong>Xeomin teve o menor HIS</strong> em qualquer dosagem e\nperíodo. <em>(Fonte: Costa et al. — citação parcial)</em></p>\n<hr />", "text": " Inúmeros pesquisadores apontam que a Dysport  não  se difunde mais nem é mais\npotente que as demais marcas. Para resultado equivalente, ela precisa ser usada na\nequivalência correta ( 2,5:1 ). Quando se usa equivalência maior (4:1 ou 3:1),\nnaturalmente há aumento do halo e da potência, pois se entrega mais TBA. Quanto ao\nhalo de ação, há quase um consenso de que o  Xeomin  tem halo menor que as demais. \n  Estudo HIS:  comparou o diâmetro do halo de inibição da sudorese (HIS) de 5 TBA\ncomerciais, em cinco doses, ao longo de 6 meses. Concluiu que quanto maior o número\nde unidades, maior o HIS para todas. Botox, Botulift, Dysport e Prosigne\napresentaram HIS semelhantes;  Xeomin teve o menor HIS  em qualquer dosagem e\nperíodo.  (Fonte: Costa et al. — citação parcial)  \n "}, {"id": "05-2-1-o-que", "title": "2.1 O que é", "part": "Parte 2 — Reconstituição", "html": "<p>Reconstituição é o processo de preparar a toxina a partir de sua forma desidratada\n(pó liofilizado) para uso. A TBA é fornecida liofilizada para garantir estabilidade\nno armazenamento e transporte. Adiciona-se um líquido estéril (geralmente solução\nsalina) ao frasco; o líquido reconstitui o pó, formando solução injetável.</p>", "text": " Reconstituição é o processo de preparar a toxina a partir de sua forma desidratada\n(pó liofilizado) para uso. A TBA é fornecida liofilizada para garantir estabilidade\nno armazenamento e transporte. Adiciona-se um líquido estéril (geralmente solução\nsalina) ao frasco; o líquido reconstitui o pó, formando solução injetável. "}, {"id": "06-2-2-cuidados-com-o-diluente", "title": "2.2 Cuidados com o diluente", "part": "Parte 2 — Reconstituição", "html": "<ul>\n<li>Use <strong>Cloreto de Sódio 0,9% de 10 ml</strong>; descarte o que sobrar após o uso.</li>\n<li>Evite frascos grandes (250 ml, 500 ml): furar o frasco várias vezes para retirar\n  pequenas quantidades aumenta o risco de contaminação.</li>\n<li>Água estéril pode ser usada, mas promove quadro álgico intenso.</li>\n<li>Leia atentamente o frasco antes da reconstituição (há relatos de profissionais que\n  reconstituíram com glicose por engano).</li>\n</ul>", "text": " \n Use  Cloreto de Sódio 0,9% de 10 ml ; descarte o que sobrar após o uso. \n Evite frascos grandes (250 ml, 500 ml): furar o frasco várias vezes para retirar\n  pequenas quantidades aumenta o risco de contaminação. \n Água estéril pode ser usada, mas promove quadro álgico intenso. \n Leia atentamente o frasco antes da reconstituição (há relatos de profissionais que\n  reconstituíram com glicose por engano). \n "}, {"id": "07-2-3-t-cnica-de-preparo", "title": "2.3 Técnica de preparo", "part": "Parte 2 — Reconstituição", "html": "<ul>\n<li>Segurar o êmbolo da seringa para o vácuo não puxar o líquido de uma vez;</li>\n<li>Introduzir o líquido lentamente;</li>\n<li>Introduzir o líquido pela parede do frasco, em ângulo de <strong>45°</strong>;</li>\n<li>Girar o frasco lentamente para espalhar o líquido no interior;</li>\n<li>Após aspirar para a seringa, <strong>não bater</strong> na seringa para tirar bolhas de ar.</li>\n</ul>", "text": " \n Segurar o êmbolo da seringa para o vácuo não puxar o líquido de uma vez; \n Introduzir o líquido lentamente; \n Introduzir o líquido pela parede do frasco, em ângulo de  45° ; \n Girar o frasco lentamente para espalhar o líquido no interior; \n Após aspirar para a seringa,  não bater  na seringa para tirar bolhas de ar. \n "}, {"id": "08-2-4-tipos-seca-tradicional", "title": "2.4 Tipos: seca × tradicional", "part": "Parte 2 — Reconstituição", "html": "<p>Tema controverso. As principais são a <strong>reconstituição seca</strong> (menos líquido) e a\n<strong>tradicional/molhada</strong> (o dobro de líquido da seca).</p>\n<p><strong>BOTOX (unidades americanas):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Frasco</th>\n<th>Seca</th>\n<th>Tradicional</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>50 U</td>\n<td>0,5 ml</td>\n<td>1 ml</td>\n</tr>\n<tr>\n<td>100 U</td>\n<td>1 ml</td>\n<td>2 ml</td>\n</tr>\n<tr>\n<td>200 U</td>\n<td>2 ml</td>\n<td>4 ml</td>\n</tr>\n</tbody>\n</table>\n<p><strong>DYSPORT</strong> (lembrando: 300 Speywood ≈ 120 U americanas; 500 Speywood ≈ 200 U\namericanas). Após reconstituída, conta-se a Dysport na seringa como se fosse em\nunidades americanas.</p>\n<table>\n<thead>\n<tr>\n<th>Frasco</th>\n<th>Seca</th>\n<th>Tradicional</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>300 Speywood (≈120 U)</td>\n<td>1,2 ml</td>\n<td>2,4 ml</td>\n</tr>\n<tr>\n<td>500 Speywood (≈200 U)</td>\n<td><code>[revisar]</code></td>\n<td>4 ml</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Obs.: em um frasco de 500 unidades <strong>não cabem</strong> 4 ml de soro fisiológico.</p>\n</blockquote>", "text": " Tema controverso. As principais são a  reconstituição seca  (menos líquido) e a\n tradicional/molhada  (o dobro de líquido da seca). \n  BOTOX (unidades americanas):  \n \n \n \n Frasco \n Seca \n Tradicional \n \n \n \n \n 50 U \n 0,5 ml \n 1 ml \n \n \n 100 U \n 1 ml \n 2 ml \n \n \n 200 U \n 2 ml \n 4 ml \n \n \n \n  DYSPORT  (lembrando: 300 Speywood ≈ 120 U americanas; 500 Speywood ≈ 200 U\namericanas). Após reconstituída, conta-se a Dysport na seringa como se fosse em\nunidades americanas. \n \n \n \n Frasco \n Seca \n Tradicional \n \n \n \n \n 300 Speywood (≈120 U) \n 1,2 ml \n 2,4 ml \n \n \n 500 Speywood (≈200 U) \n  [revisar]  \n 4 ml \n \n \n \n \n Obs.: em um frasco de 500 unidades  não cabem  4 ml de soro fisiológico. \n "}, {"id": "09-2-5-qual-reconstitui-o-usar", "title": "2.5 Qual reconstituição usar?", "part": "Parte 2 — Reconstituição", "html": "<p>A escolha é pessoal; ambas são seguras e efetivas.\n- <strong>Seca:</strong> mais fácil de contar na maior parte das seringas; maior eficácia em área concentrada.\n- <strong>Tradicional:</strong> mais fácil de contar na seringa de 100U; em caso de desperdício, perdem-se menos unidades.</p>\n<hr />", "text": " A escolha é pessoal; ambas são seguras e efetivas.\n-  Seca:  mais fácil de contar na maior parte das seringas; maior eficácia em área concentrada.\n-  Tradicional:  mais fácil de contar na seringa de 100U; em caso de desperdício, perdem-se menos unidades. \n "}, {"id": "10-parte-3-materiais-utilizados-na-aplica-o", "title": "Parte 3 — Materiais utilizados na aplicação", "part": "Parte 3 — Materiais utilizados na aplicação", "html": "<ul>\n<li><strong>Caneta para resfriamento da pele:</strong> armazenar no freezer por no mínimo 60 min.\n  Encostar a ponta na pele por 5–7 s para analgesia temporária; retirar e aplicar\n  imediatamente. Mantém a eficiência (ponta gelada) por ~25 min, quando deve passar\n  por nova assepsia e voltar ao freezer.</li>\n<li><strong>Termômetro digital:</strong> a maioria das marcas exige refrigeração de <strong>2 ºC a 8 ºC</strong>.\n  É exigência da vigilância sanitária ter termômetro na geladeira, com registro\n  diário da temperatura, para evitar grandes variações. Armazenamento fora do\n  recomendado compromete a eficácia.</li>\n<li><strong>Massageador por vibração:</strong> abordagem simples, segura, eficaz e de baixo custo\n  para reduzir a sensação de dor em áreas sensíveis.</li>\n<li><strong>Lápis dermatográfico:</strong> fundamental para marcar cada local de aplicação, já que\n  cada aplicação é individual (padrão de contração e queixa de cada paciente).</li>\n<li><strong>Seringa de insulina:</strong> com agulha fixa (em tese, zero perdas) ou agulha móvel\n  \"zero resíduos\". Como a agulha é muito fina, vale trocar o dispositivo durante o\n  procedimento para causar menos desconforto.</li>\n</ul>\n<hr />", "text": " \n  Caneta para resfriamento da pele:  armazenar no freezer por no mínimo 60 min.\n  Encostar a ponta na pele por 5–7 s para analgesia temporária; retirar e aplicar\n  imediatamente. Mantém a eficiência (ponta gelada) por ~25 min, quando deve passar\n  por nova assepsia e voltar ao freezer. \n  Termômetro digital:  a maioria das marcas exige refrigeração de  2 ºC a 8 ºC .\n  É exigência da vigilância sanitária ter termômetro na geladeira, com registro\n  diário da temperatura, para evitar grandes variações. Armazenamento fora do\n  recomendado compromete a eficácia. \n  Massageador por vibração:  abordagem simples, segura, eficaz e de baixo custo\n  para reduzir a sensação de dor em áreas sensíveis. \n  Lápis dermatográfico:  fundamental para marcar cada local de aplicação, já que\n  cada aplicação é individual (padrão de contração e queixa de cada paciente). \n  Seringa de insulina:  com agulha fixa (em tese, zero perdas) ou agulha móvel\n  \"zero resíduos\". Como a agulha é muito fina, vale trocar o dispositivo durante o\n  procedimento para causar menos desconforto. \n \n "}, {"id": "11-4-1-seringa-de-30u-0-3-ml-30-tra-os-marc", "title": "4.1 Seringa de 30U (0,3 ml — 30 traços, marca de 1 em 1)", "part": "Parte 4 — Contagem de unidades nas seringas", "html": "<blockquote>\n<p>Regra geral: <strong>Seca → 1 traço = 1U</strong>; <strong>Tradicional → 2 traços = 1U</strong> (1 traço = 0,5U).</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>Diluente</th>\n<th>Reconstituição</th>\n<th>Valor do traço</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0,5 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>2 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n<tr>\n<td>2 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>4 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n</tbody>\n</table>", "text": " \n Regra geral:  Seca → 1 traço = 1U ;  Tradicional → 2 traços = 1U  (1 traço = 0,5U). \n \n \n \n \n Diluente \n Reconstituição \n Valor do traço \n \n \n \n \n 0,5 ml \n Seca \n 1 traço = 1U \n \n \n 1 ml \n Tradicional \n 2 traços = 1U \n \n \n 1 ml \n Seca \n 1 traço = 1U \n \n \n 2 ml \n Tradicional \n 2 traços = 1U \n \n \n 2 ml \n Seca \n 1 traço = 1U \n \n \n 4 ml \n Tradicional \n 2 traços = 1U \n \n \n "}, {"id": "12-4-2-seringa-de-50u-0-5-ml-50-tra-os-marc", "title": "4.2 Seringa de 50U (0,5 ml — 50 traços, marca de 1 em 1)", "part": "Parte 4 — Contagem de unidades nas seringas", "html": "<table>\n<thead>\n<tr>\n<th>Diluente</th>\n<th>Reconstituição</th>\n<th>Valor do traço</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0,5 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>2 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n<tr>\n<td>2 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>4 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n</tbody>\n</table>", "text": " \n \n \n Diluente \n Reconstituição \n Valor do traço \n \n \n \n \n 0,5 ml \n Seca \n 1 traço = 1U \n \n \n 1 ml \n Tradicional \n 2 traços = 1U \n \n \n 1 ml \n Seca \n 1 traço = 1U \n \n \n 2 ml \n Tradicional \n 2 traços = 1U \n \n \n 2 ml \n Seca \n 1 traço = 1U \n \n \n 4 ml \n Tradicional \n 2 traços = 1U \n \n \n "}, {"id": "13-4-3-seringa-de-100u-1-ml-pode-ter-50-ou-", "title": "4.3 Seringa de 100U (1 ml — pode ter 50 ou 100 traços)", "part": "Parte 4 — Contagem de unidades nas seringas", "html": "<p>Pode marcar <strong>de 1 em 1</strong> (100 traços) ou <strong>de 2 em 2</strong> (50 traços).</p>\n<ul>\n<li><strong>Marca de 1 em 1 (100 traços):</strong> entre o 40 e o 50 há 10 traços → 100 traços no total.</li>\n<li><strong>Marca de 2 em 2 (50 traços):</strong> entre o 40 e o 50 há 5 traços → 50 traços no total\n  (1 traço = 2U na seca; 1 traço = 1U na tradicional).</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Diluente</th>\n<th>Reconstituição</th>\n<th>Valor do traço (100 traços)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0,5 ml</td>\n<td>Seca</td>\n<td>1 traço = 0,5U (2 traços = 1U) <code>[revisar]</code></td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n<tr>\n<td>1 ml</td>\n<td>Seca</td>\n<td>1 traço = 1U</td>\n</tr>\n<tr>\n<td>2 ml</td>\n<td>Tradicional</td>\n<td>2 traços = 1U</td>\n</tr>\n</tbody>\n</table>\n<hr />", "text": " Pode marcar  de 1 em 1  (100 traços) ou  de 2 em 2  (50 traços). \n \n  Marca de 1 em 1 (100 traços):  entre o 40 e o 50 há 10 traços → 100 traços no total. \n  Marca de 2 em 2 (50 traços):  entre o 40 e o 50 há 5 traços → 50 traços no total\n  (1 traço = 2U na seca; 1 traço = 1U na tradicional). \n \n \n \n \n Diluente \n Reconstituição \n Valor do traço (100 traços) \n \n \n \n \n 0,5 ml \n Seca \n 1 traço = 0,5U (2 traços = 1U)  [revisar]  \n \n \n 1 ml \n Tradicional \n 2 traços = 1U \n \n \n 1 ml \n Seca \n 1 traço = 1U \n \n \n 2 ml \n Tradicional \n 2 traços = 1U \n \n \n \n "}, {"id": "14-parte-5-marcas-de-toxina-botul-nica-auto", "title": "Parte 5 — Marcas de toxina botulínica autorizadas no Brasil", "part": "Parte 5 — Marcas de toxina botulínica autorizadas no Brasil", "html": "<blockquote>\n<p>Dados técnicos (temperatura de armazenamento, prazo após preparo, composição).\nVários campos vieram parcialmente ilegíveis no OCR — confirmar na bula. <code>[revisar]</code></p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>Marca</th>\n<th>Antes do preparo</th>\n<th>Após o preparo</th>\n<th>Prazo após preparo</th>\n<th>Composição</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Botox</strong> (100 U)</td>\n<td>Freezer/compart. inferior ou geladeira 2–8 ºC</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 3 dias</td>\n<td>Albumina humana + cloreto de sódio</td>\n</tr>\n<tr>\n<td><strong>Dysport</strong></td>\n<td><code>[revisar]</code></td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 24 h</td>\n<td>Albumina humana + lactose</td>\n</tr>\n<tr>\n<td><strong>Nabota</strong> (100 U)</td>\n<td><code>[revisar]</code></td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 24 h</td>\n<td>Albumina humana + cloreto de sódio</td>\n</tr>\n<tr>\n<td><strong>Xeomin</strong></td>\n<td>Pode ficar em temp. ambiente*</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 24 h</td>\n<td>Albumina humana + sacarose</td>\n</tr>\n<tr>\n<td><strong>Botulift</strong> (100 U)</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 7 dias</td>\n<td>Albumina humana + cloreto de sódio</td>\n</tr>\n<tr>\n<td><strong>Botulim</strong></td>\n<td>Geladeira 2–8 ºC</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 24 h</td>\n<td>Albumina humana + cloreto de sódio</td>\n</tr>\n<tr>\n<td><strong>Prosigne</strong></td>\n<td>Geladeira 2–8 ºC</td>\n<td>Geladeira 2–8 ºC</td>\n<td>Até 4 h</td>\n<td><code>[revisar]</code></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>* <strong>Xeomin</strong> pode ser mantida em temperatura ambiente antes da reconstituição;\nnesse caso, reconstituir com soro na mesma temperatura. <strong>O soro fisiológico deve\nestar sempre na mesma temperatura que a toxina.</strong></p>\n</blockquote>\n<hr />", "text": " \n Dados técnicos (temperatura de armazenamento, prazo após preparo, composição).\nVários campos vieram parcialmente ilegíveis no OCR — confirmar na bula.  [revisar]  \n \n \n \n \n Marca \n Antes do preparo \n Após o preparo \n Prazo após preparo \n Composição \n \n \n \n \n  Botox  (100 U) \n Freezer/compart. inferior ou geladeira 2–8 ºC \n Geladeira 2–8 ºC \n Até 3 dias \n Albumina humana + cloreto de sódio \n \n \n  Dysport  \n  [revisar]  \n Geladeira 2–8 ºC \n Até 24 h \n Albumina humana + lactose \n \n \n  Nabota  (100 U) \n  [revisar]  \n Geladeira 2–8 ºC \n Até 24 h \n Albumina humana + cloreto de sódio \n \n \n  Xeomin  \n Pode ficar em temp. ambiente* \n Geladeira 2–8 ºC \n Até 24 h \n Albumina humana + sacarose \n \n \n  Botulift  (100 U) \n Geladeira 2–8 ºC \n Geladeira 2–8 ºC \n Até 7 dias \n Albumina humana + cloreto de sódio \n \n \n  Botulim  \n Geladeira 2–8 ºC \n Geladeira 2–8 ºC \n Até 24 h \n Albumina humana + cloreto de sódio \n \n \n  Prosigne  \n Geladeira 2–8 ºC \n Geladeira 2–8 ºC \n Até 4 h \n  [revisar]  \n \n \n \n \n *  Xeomin  pode ser mantida em temperatura ambiente antes da reconstituição;\nnesse caso, reconstituir com soro na mesma temperatura.  O soro fisiológico deve\nestar sempre na mesma temperatura que a toxina.  \n \n "}, {"id": "15-6-1-israderm-toxina-proibida-no-brasil", "title": "6.1 Israderm — toxina proibida no Brasil", "part": "Parte 6 — Segurança e falsificações", "html": "<p>Comercializada como opção mais acessível, mas <strong>sem estudos/documentação</strong> que\nrevelem o conteúdo dos frascos, origem de fabricação e embalagem. Por isso a ANVISA\nnão permitiu venda, distribuição, formulação, promoção e utilização. <strong>Seu uso é\nproibido no Brasil.</strong></p>", "text": " Comercializada como opção mais acessível, mas  sem estudos/documentação  que\nrevelem o conteúdo dos frascos, origem de fabricação e embalagem. Por isso a ANVISA\nnão permitiu venda, distribuição, formulação, promoção e utilização.  Seu uso é\nproibido no Brasil.  "}, {"id": "16-6-2-cuidado-com-as-falsifica-es", "title": "6.2 Cuidado com as falsificações", "part": "Parte 6 — Segurança e falsificações", "html": "<p>Após a repercussão negativa, vendedores passaram a vendê-la com <strong>rótulo de toxinas\npermitidas</strong>, e alguns \"profissionais\" compram sabendo disso. (O ebook traz o\nregistro de uma conversa do autor com um desses vendedores, que oferecia Israderm na\nembalagem de Dysport.)</p>", "text": " Após a repercussão negativa, vendedores passaram a vendê-la com  rótulo de toxinas\npermitidas , e alguns \"profissionais\" compram sabendo disso. (O ebook traz o\nregistro de uma conversa do autor com um desses vendedores, que oferecia Israderm na\nembalagem de Dysport.) "}, {"id": "17-6-3-usar-israderm-crime-grave", "title": "6.3 Usar Israderm é crime grave", "part": "Parte 6 — Segurança e falsificações", "html": "<p>Cirurgiã-dentista presa em flagrante pela Polícia Civil por usar marca proibida no\nBrasil. Foram encontrados diversos frascos de Israderm e irregularidades sanitárias.\nOs frascos de Israderm traziam <strong>rótulo de Xeomin</strong> para burlar a fiscalização e\nfazer os pacientes acreditarem que recebiam produto permitido.\n<em>Fonte: pc.rs.gov.br (notícia oficial).</em> <code>[trechos reconstruídos do OCR]</code></p>", "text": " Cirurgiã-dentista presa em flagrante pela Polícia Civil por usar marca proibida no\nBrasil. Foram encontrados diversos frascos de Israderm e irregularidades sanitárias.\nOs frascos de Israderm traziam  rótulo de Xeomin  para burlar a fiscalização e\nfazer os pacientes acreditarem que recebiam produto permitido.\n Fonte: pc.rs.gov.br (notícia oficial).   [trechos reconstruídos do OCR]  "}, {"id": "18-6-4-intercorr-ncia-ap-s-uso-de-tba-sem-r", "title": "6.4 Intercorrência após uso de TBA sem registro", "part": "Parte 6 — Segurança e falsificações", "html": "<p>Homem de 41 anos deu entrada no PS com edema fronto-orbital grave e lesões na testa\napós injeção de TBA tipo A por um \"praticante\" conhecido nas redes sociais\n(1 dia antes). Lesão semelhante a abscesso exigiu incisão e drenagem em centro\ncirúrgico; <strong>extensa necrose</strong> exigiu desbridamento até o músculo frontal, com novo\ndesbridamento 48 h depois e drenagem de três nódulos purulentos. O praticante não\nera qualificado e a toxina foi comprada online sem controle. <em>Fonte: Cohen (2021).</em></p>", "text": " Homem de 41 anos deu entrada no PS com edema fronto-orbital grave e lesões na testa\napós injeção de TBA tipo A por um \"praticante\" conhecido nas redes sociais\n(1 dia antes). Lesão semelhante a abscesso exigiu incisão e drenagem em centro\ncirúrgico;  extensa necrose  exigiu desbridamento até o músculo frontal, com novo\ndesbridamento 48 h depois e drenagem de três nódulos purulentos. O praticante não\nera qualificado e a toxina foi comprada online sem controle.  Fonte: Cohen (2021).  "}, {"id": "19-6-5-tba-de-proced-ncia-ignorada", "title": "6.5 TBA de procedência ignorada", "part": "Parte 6 — Segurança e falsificações", "html": "<p>Foto enviada por colega que comprou Nabota de um representante e recebeu o produto\n<strong>sem informações em português</strong>. Não pode ser utilizada nessas condições — pode ser\nclassificada como de \"procedência ignorada\".</p>\n<hr />", "text": " Foto enviada por colega que comprou Nabota de um representante e recebeu o produto\n sem informações em português . Não pode ser utilizada nessas condições — pode ser\nclassificada como de \"procedência ignorada\". \n "}, {"id": "20-parte-7-suplementa-o-fitase-e-zinco", "title": "Parte 7 — Suplementação (Fitase e Zinco)", "part": "Parte 7 — Suplementação (Fitase e Zinco)", "html": "<p><strong>Sugestão de protocolo:</strong>\n- <strong>5 dias antes</strong> da aplicação: Zinco (citrato) 50 mg + Fitase 3000 UI — 1 cápsula/dia.\n- <strong>Após</strong> a aplicação: Zinco (bisglicinato) 12 mg — 1 cápsula/dia, por 15 dias.</p>\n<hr />", "text": "  Sugestão de protocolo: \n-  5 dias antes  da aplicação: Zinco (citrato) 50 mg + Fitase 3000 UI — 1 cápsula/dia.\n-  Após  a aplicação: Zinco (bisglicinato) 12 mg — 1 cápsula/dia, por 15 dias. \n "}, {"id": "21-8-1-origem-e-inser-o", "title": "8.1 Origem e inserção", "part": "Parte 8 — Anatomia muscular (fundamentos)", "html": "<p>Como regra, os músculos da face <strong>originam-se no osso</strong> e <strong>inserem-se na fáscia\nsuperficial, derme ou em outros músculos</strong> — por isso a pele se movimenta na\ncontração. Na contração, a inserção se aproxima da origem, e as <strong>rugas se formam\nperpendicularmente</strong> à direção da contração: contração vertical → rugas horizontais;\ncontração horizontal → rugas verticais. <em>Fonte: Zarins (2021).</em></p>", "text": " Como regra, os músculos da face  originam-se no osso  e  inserem-se na fáscia\nsuperficial, derme ou em outros músculos  — por isso a pele se movimenta na\ncontração. Na contração, a inserção se aproxima da origem, e as  rugas se formam\nperpendicularmente  à direção da contração: contração vertical → rugas horizontais;\ncontração horizontal → rugas verticais.  Fonte: Zarins (2021).  "}, {"id": "22-8-2-profundidade-da-aplica-o", "title": "8.2 Profundidade da aplicação", "part": "Parte 8 — Anatomia muscular (fundamentos)", "html": "<ul>\n<li>Aplicação na <strong>origem</strong> (profunda, no osso) → pode ser <strong>profunda</strong>.</li>\n<li>Aplicação na <strong>inserção</strong> (superficial, na pele) → pode ser <strong>mais superficial</strong>.</li>\n<li><strong>Cuidado</strong> com o contato intenso com o osso: a ponta da agulha pode deformar,\n  causando mais desconforto. <em>Fonte: Goodman et al. (2021).</em></li>\n</ul>\n<hr />", "text": " \n Aplicação na  origem  (profunda, no osso) → pode ser  profunda . \n Aplicação na  inserção  (superficial, na pele) → pode ser  mais superficial . \n  Cuidado  com o contato intenso com o osso: a ponta da agulha pode deformar,\n  causando mais desconforto.  Fonte: Goodman et al. (2021).  \n \n "}, {"id": "23-9-1-rugas-est-ticas-din-micas", "title": "9.1 Rugas estáticas × dinâmicas", "part": "Parte 9 — Avaliação clínica do paciente", "html": "<ul>\n<li><strong>Estáticas:</strong> presentes mesmo em repouso; resultado do envelhecimento, contração\n  muscular excessiva, perda de colágeno/elastina, exposição solar e fatores\n  ambientais. Mais perceptíveis onde a pele é mais fina (olhos, boca).</li>\n<li><strong>Dinâmicas:</strong> formam-se com os movimentos faciais (sorrir, franzir a testa).\n  Exemplos clássicos: \"pés de galinha\" e rugas da testa.</li>\n</ul>", "text": " \n  Estáticas:  presentes mesmo em repouso; resultado do envelhecimento, contração\n  muscular excessiva, perda de colágeno/elastina, exposição solar e fatores\n  ambientais. Mais perceptíveis onde a pele é mais fina (olhos, boca). \n  Dinâmicas:  formam-se com os movimentos faciais (sorrir, franzir a testa).\n  Exemplos clássicos: \"pés de galinha\" e rugas da testa. \n "}, {"id": "24-9-2-hipercin-tico-normocin-tico", "title": "9.2 Hipercinético × normocinético", "part": "Parte 9 — Avaliação clínica do paciente", "html": "<ul>\n<li><strong>Hipercinético:</strong> atividade muscular facial excessiva; rugas mais proeminentes\n  pela contração repetitiva.</li>\n<li><strong>Normocinético:</strong> atividade muscular dentro do normal; tende a exibir menos rugas\n  dinâmicas.</li>\n</ul>", "text": " \n  Hipercinético:  atividade muscular facial excessiva; rugas mais proeminentes\n  pela contração repetitiva. \n  Normocinético:  atividade muscular dentro do normal; tende a exibir menos rugas\n  dinâmicas. \n "}, {"id": "25-9-3-anest-sicos-t-picos-formula-es-de-la", "title": "9.3 Anestésicos tópicos — formulações de laboratório", "part": "Parte 9 — Avaliação clínica do paciente", "html": "<ul>\n<li>Lidocaína 30% + Procaína 10%</li>\n<li>Tetracaína 25% + Lidocaína 23%</li>\n</ul>\n<hr />", "text": " \n Lidocaína 30% + Procaína 10% \n Tetracaína 25% + Lidocaína 23% \n \n "}, {"id": "26-10-1-testa-m-sculo-occipitofrontal-ventr", "title": "10.1 Testa — músculo occipitofrontal (ventre frontal)", "part": "Parte 10 — Músculos e aplicação por região", "html": "<blockquote>\n<p><strong>Legenda dos mapas:</strong> START = origem do músculo; FINISH = inserção do músculo.\nDoses em U/ponto são médias — <code>[revisar]</code> todos os valores.</p>\n</blockquote>\n<ul>\n<li><strong>Origem:</strong> aponeurose epicraniana.</li>\n<li><strong>Inserção:</strong> pele da fronte; margem supraorbital; corrugador e abaixador do\n  supercílio (entrelaça-se com o prócero e o orbicular do olho).</li>\n<li><strong>Função:</strong> eleva as sobrancelhas, enruga a pele da testa.</li>\n<li><em>(Há também o ventre occipital, com campos ilegíveis no OCR.)</em> <code>[revisar]</code></li>\n</ul>\n<p><strong>Linha de convergência (linha C):</strong> no estudo de Cotofana et al. (2020), a pele da\ntesta inferior move-se cranialmente e a superior caudalmente, encontrando-se numa\nlinha estática (linha C), identificada em ~61% do comprimento médio da testa.\nClinicamente, corresponde à segunda linha horizontal da testa de cima para baixo.\n<strong>Injetar acima da linha C pode reduzir o risco de ptose da sobrancelha.</strong></p>\n<p><strong>Padrões de contração frontal</strong> <em>(Braz e Sakuma, 2010)</em> — três padrões:\n- <strong>Total</strong> (mais frequente): rítides horizontais do centro avançam lateralmente\n  além da linha mediopupilar, até o final da cauda das sobrancelhas.\n- <strong>Medial</strong> (2º mais frequente): rítides concentradas na região central, contidas\n  entre as linhas mediopupilares; padrão mais fácil para trabalhar o arqueamento.\n- <strong>Lateral</strong> (menos frequente): rugas predominam nas laterais, após a linha\n  mediopupilar; menor quantidade/intensidade, podendo estar ausentes na região medial.</p>\n<p><strong>Aplicação (frontal):</strong>\n- Respeitar <strong>1 cm</strong> da sobrancelha no rumo da pupila.\n- <strong>1 a 2 cm</strong> entre os pontos, aplicando na parte mais espessa.\n- Seringa na horizontal (<strong>45°</strong>).\n- Média de <strong>10 a 30 U por ponto</strong>. <code>[revisar]</code></p>", "text": " \n  Legenda dos mapas:  START = origem do músculo; FINISH = inserção do músculo.\nDoses em U/ponto são médias —  [revisar]  todos os valores. \n \n \n  Origem:  aponeurose epicraniana. \n  Inserção:  pele da fronte; margem supraorbital; corrugador e abaixador do\n  supercílio (entrelaça-se com o prócero e o orbicular do olho). \n  Função:  eleva as sobrancelhas, enruga a pele da testa. \n  (Há também o ventre occipital, com campos ilegíveis no OCR.)   [revisar]  \n \n  Linha de convergência (linha C):  no estudo de Cotofana et al. (2020), a pele da\ntesta inferior move-se cranialmente e a superior caudalmente, encontrando-se numa\nlinha estática (linha C), identificada em ~61% do comprimento médio da testa.\nClinicamente, corresponde à segunda linha horizontal da testa de cima para baixo.\n Injetar acima da linha C pode reduzir o risco de ptose da sobrancelha.  \n  Padrões de contração frontal   (Braz e Sakuma, 2010)  — três padrões:\n-  Total  (mais frequente): rítides horizontais do centro avançam lateralmente\n  além da linha mediopupilar, até o final da cauda das sobrancelhas.\n-  Medial  (2º mais frequente): rítides concentradas na região central, contidas\n  entre as linhas mediopupilares; padrão mais fácil para trabalhar o arqueamento.\n-  Lateral  (menos frequente): rugas predominam nas laterais, após a linha\n  mediopupilar; menor quantidade/intensidade, podendo estar ausentes na região medial. \n  Aplicação (frontal): \n- Respeitar  1 cm  da sobrancelha no rumo da pupila.\n-  1 a 2 cm  entre os pontos, aplicando na parte mais espessa.\n- Seringa na horizontal ( 45° ).\n- Média de  10 a 30 U por ponto .  [revisar]  "}, {"id": "27-10-2-glabela", "title": "10.2 Glabela", "part": "Parte 10 — Músculos e aplicação por região", "html": "<p>Músculos envolvidos:\n- <strong>Prócero</strong> — Origem: osso nasal e parte superior da cartilagem nasal. Inserção:\n  pele entre as sobrancelhas, fundindo-se com a extremidade do frontal. Função: puxa\n  para baixo a extremidade medial da sobrancelha, enrugando a glabela.\n- <strong>Depressor do supercílio</strong> — Origem: processo frontal da maxila. Inserção/Função:\n  <code>[texto cortado no OCR — revisar]</code>.\n- <strong>Corrugador do supercílio</strong> — Origem: osso frontal (extremidade medial dos arcos\n  superciliares). Inserção: superfície profunda da pele, margem supraorbital.\n  Função: <code>[cortado — revisar]</code>.</p>\n<p><strong>Legenda das rugas da glabela:</strong> amarelo = corrugadores; verde = depressor do\nsupercílio (principalmente); azul = prócero.</p>\n<p><strong>Profundidade:</strong> na <strong>origem</strong> dos músculos da glabela, aplicação <strong>profunda</strong>. Na\n<strong>inserção do prócero</strong>, pode ser superficial ou profunda. Perto da <strong>inserção dos\ncorrugadores</strong>, <strong>não</strong> aplicar profundo (risco de transfixar o músculo e entregar\nTBA na cavidade orbitária). \"Superficial\" não significa pápula — deve-se passar a derme.</p>\n<p><strong>Aplicação:</strong> agulha a <strong>45° ou 90°</strong> (o autor pinça, entra 90°, solta e aprofunda).\n<strong>Nunca</strong> aplicar com a ponta da agulha voltada para o olho. Média de <strong>20 a 50 U por\nponto</strong>. <code>[revisar]</code></p>", "text": " Músculos envolvidos:\n-  Prócero  — Origem: osso nasal e parte superior da cartilagem nasal. Inserção:\n  pele entre as sobrancelhas, fundindo-se com a extremidade do frontal. Função: puxa\n  para baixo a extremidade medial da sobrancelha, enrugando a glabela.\n-  Depressor do supercílio  — Origem: processo frontal da maxila. Inserção/Função:\n   [texto cortado no OCR — revisar] .\n-  Corrugador do supercílio  — Origem: osso frontal (extremidade medial dos arcos\n  superciliares). Inserção: superfície profunda da pele, margem supraorbital.\n  Função:  [cortado — revisar] . \n  Legenda das rugas da glabela:  amarelo = corrugadores; verde = depressor do\nsupercílio (principalmente); azul = prócero. \n  Profundidade:  na  origem  dos músculos da glabela, aplicação  profunda . Na\n inserção do prócero , pode ser superficial ou profunda. Perto da  inserção dos\ncorrugadores ,  não  aplicar profundo (risco de transfixar o músculo e entregar\nTBA na cavidade orbitária). \"Superficial\" não significa pápula — deve-se passar a derme. \n  Aplicação:  agulha a  45° ou 90°  (o autor pinça, entra 90°, solta e aprofunda).\n Nunca  aplicar com a ponta da agulha voltada para o olho. Média de  20 a 50 U por\nponto .  [revisar]  "}, {"id": "28-10-3-periorbital-m-sculo-orbicular-do-ol", "title": "10.3 Periorbital — músculo orbicular do olho (\"pés de galinha\")", "part": "Parte 10 — Músculos e aplicação por região", "html": "<ul>\n<li><strong>Origem:</strong> parte orbital (osso frontal — margem orbital medial; ligamento\n  palpebral medial); parte palpebral (ligamento palpebral medial); parte lacrimal\n  (maxila — processo frontal).</li>\n<li><strong>Inserção/Função:</strong> <code>[parcialmente ilegível — revisar]</code>.</li>\n</ul>\n<p><strong>Aplicação:</strong> mesmas recomendações da glabela; agulha a <strong>45° ou 90°</strong>. Evitar a\nponta voltada para o olho (risco de relaxar o levantador da pálpebra superior ou\nmúsculos extraoculares). Média de <strong>2 a 4 U por ponto</strong>.</p>\n<p><strong>Área segura (para iniciantes):</strong> a partir do canto do olho, trace uma linha\nhorizontal e uma vertical; aplique entre elas. Meça <strong>1 cm (ou um dedo)</strong> do olho\npara achar o ponto. Distância <strong>menor</strong> aumenta o risco de atingir músculo\nextraocular; <strong>maior</strong> aumenta o risco de atingir músculo da movimentação da boca.\n<strong>Sempre sobre a base óssea, nunca dentro da cavidade orbitária</strong> (sempre acima da\nmargem orbital).</p>\n<p><strong>Riscos / músculos extraoculares:</strong> aplicação na pálpebra inferior pode atingir o\n<strong>reto inferior</strong>; injeções perto do canto lateral (pés de galinha) podem atingir o\n<strong>reto lateral</strong> → intercorrências (possível <strong>diplopia</strong>). Extraoculares citados:\nreto lateral, reto superior, oblíquo superior, reto medial, reto inferior.</p>\n<p><strong>Erros:</strong> errar direção/local/profundidade pode atingir músculos responsáveis pela\nmovimentação da boca.</p>", "text": " \n  Origem:  parte orbital (osso frontal — margem orbital medial; ligamento\n  palpebral medial); parte palpebral (ligamento palpebral medial); parte lacrimal\n  (maxila — processo frontal). \n  Inserção/Função:   [parcialmente ilegível — revisar] . \n \n  Aplicação:  mesmas recomendações da glabela; agulha a  45° ou 90° . Evitar a\nponta voltada para o olho (risco de relaxar o levantador da pálpebra superior ou\nmúsculos extraoculares). Média de  2 a 4 U por ponto . \n  Área segura (para iniciantes):  a partir do canto do olho, trace uma linha\nhorizontal e uma vertical; aplique entre elas. Meça  1 cm (ou um dedo)  do olho\npara achar o ponto. Distância  menor  aumenta o risco de atingir músculo\nextraocular;  maior  aumenta o risco de atingir músculo da movimentação da boca.\n Sempre sobre a base óssea, nunca dentro da cavidade orbitária  (sempre acima da\nmargem orbital). \n  Riscos / músculos extraoculares:  aplicação na pálpebra inferior pode atingir o\n reto inferior ; injeções perto do canto lateral (pés de galinha) podem atingir o\n reto lateral  → intercorrências (possível  diplopia ). Extraoculares citados:\nreto lateral, reto superior, oblíquo superior, reto medial, reto inferior. \n  Erros:  errar direção/local/profundidade pode atingir músculos responsáveis pela\nmovimentação da boca. "}, {"id": "29-10-4-m-sculos-zigom-ticos", "title": "10.4 Músculos zigomáticos", "part": "Parte 10 — Músculos e aplicação por região", "html": "<ul>\n<li><strong>Zigomático menor</strong> — Origem: osso zigomático, próximo à sutura\n  zigomaticomaxilar. Inserção: múltiplas inserções na pele (seção média do sulco\n  nasolabial; fibras do orbicular da boca; maioria terminando na parte lateral do\n  lábio). Função: puxa parte do sulco nasolabial e a porção média de um lado do lábio.</li>\n<li><strong>Zigomático maior</strong> — Origem: osso zigomático, próximo à sutura\n  zigomaticotemporal. Inserção: ângulo da boca (modíolo). Função: eleva e puxa o\n  canto da boca.</li>\n</ul>\n<p><strong>Cuidado:</strong> esses músculos ficam próximos e <strong>abaixo</strong> do orbicular do olho. Quanto\nmais se desce em direção ao corpo do osso zigomático, maior a chance de atingir a\norigem deles. Aplicar ao longo de toda a ruga do sorriso, sem conhecimento\nanatômico, certamente atinge os zigomáticos.</p>\n<p><strong>Caso real:</strong> assimetria após erro de aplicação no orbicular do olho —\ncomprometimento do levantamento e abertura de um lado da boca (erro ao aplicar no\nponto mais inferior, atingindo músculos com origem no osso zigomático).</p>", "text": " \n  Zigomático menor  — Origem: osso zigomático, próximo à sutura\n  zigomaticomaxilar. Inserção: múltiplas inserções na pele (seção média do sulco\n  nasolabial; fibras do orbicular da boca; maioria terminando na parte lateral do\n  lábio). Função: puxa parte do sulco nasolabial e a porção média de um lado do lábio. \n  Zigomático maior  — Origem: osso zigomático, próximo à sutura\n  zigomaticotemporal. Inserção: ângulo da boca (modíolo). Função: eleva e puxa o\n  canto da boca. \n \n  Cuidado:  esses músculos ficam próximos e  abaixo  do orbicular do olho. Quanto\nmais se desce em direção ao corpo do osso zigomático, maior a chance de atingir a\norigem deles. Aplicar ao longo de toda a ruga do sorriso, sem conhecimento\nanatômico, certamente atinge os zigomáticos. \n  Caso real:  assimetria após erro de aplicação no orbicular do olho —\ncomprometimento do levantamento e abertura de um lado da boca (erro ao aplicar no\nponto mais inferior, atingindo músculos com origem no osso zigomático). "}, {"id": "30-10-5-p-lpebra-inferior", "title": "10.5 Pálpebra inferior", "part": "Parte 10 — Músculos e aplicação por região", "html": "<p>Logo abaixo do orbicular do olho está o <strong>levantador do lábio superior</strong>; atingi-lo\npode comprometer o sorriso do paciente.</p>\n<blockquote>\n<p><strong>Curiosidade:</strong> alguns autores afirmam que as covinhas nas bochechas são formadas\npor variações do músculo zigomático maior.</p>\n</blockquote>", "text": " Logo abaixo do orbicular do olho está o  levantador do lábio superior ; atingi-lo\npode comprometer o sorriso do paciente. \n \n  Curiosidade:  alguns autores afirmam que as covinhas nas bochechas são formadas\npor variações do músculo zigomático maior. \n "}, {"id": "31-10-6-l-bio-superior-e-sorriso-gengival", "title": "10.6 Lábio superior e sorriso gengival", "part": "Parte 10 — Músculos e aplicação por região", "html": "<p><strong>Sorriso gengival:</strong> a hiperfunção dos músculos do lábio superior (principalmente o\n<strong>levantador do lábio superior</strong>) eleva exageradamente a linha da gengiva, expondo\ntecido gengival em excesso ao sorrir.</p>\n<ul>\n<li><strong>Levantador do lábio superior</strong> — Origem: margem infraorbital medial (acima do\n  forame infraorbital). Inserção: porção médio-lateral da pele do lábio superior.\n  Função: eleva e everte o lábio superior.</li>\n<li><strong>Levantador do lábio superior e asa do nariz (LLSAN)</strong> — Origem: periósteo do\n  processo frontal da maxila. Inserção: asa do nariz e parte lateral do lábio\n  superior. Função: movimentar os lábios e elevar a asa do nariz.</li>\n</ul>\n<p><strong>Aplicação:</strong> a partir do meio da asa do nariz, meça <strong>1 cm horizontalmente</strong> e\nentre a <strong>90°</strong> — atinge o levantador do lábio superior e/ou o LLSAN, abaixando\nsuavemente o sorriso sem tirar a mobilidade do lábio. Média de <strong>10 a 20 U por\nponto</strong>. <code>[revisar]</code></p>\n<blockquote>\n<p><strong>Por que evitar o músculo orbicular da boca:</strong> dependendo da quantidade aplicada,\no paciente fica com aparência artificial ao sorrir.</p>\n</blockquote>", "text": "  Sorriso gengival:  a hiperfunção dos músculos do lábio superior (principalmente o\n levantador do lábio superior ) eleva exageradamente a linha da gengiva, expondo\ntecido gengival em excesso ao sorrir. \n \n  Levantador do lábio superior  — Origem: margem infraorbital medial (acima do\n  forame infraorbital). Inserção: porção médio-lateral da pele do lábio superior.\n  Função: eleva e everte o lábio superior. \n  Levantador do lábio superior e asa do nariz (LLSAN)  — Origem: periósteo do\n  processo frontal da maxila. Inserção: asa do nariz e parte lateral do lábio\n  superior. Função: movimentar os lábios e elevar a asa do nariz. \n \n  Aplicação:  a partir do meio da asa do nariz, meça  1 cm horizontalmente  e\nentre a  90°  — atinge o levantador do lábio superior e/ou o LLSAN, abaixando\nsuavemente o sorriso sem tirar a mobilidade do lábio. Média de  10 a 20 U por\nponto .  [revisar]  \n \n  Por que evitar o músculo orbicular da boca:  dependendo da quantidade aplicada,\no paciente fica com aparência artificial ao sorrir. \n "}, {"id": "32-10-7-nariz-m-sculo-nasal-e-bunny-lines", "title": "10.7 Nariz — músculo nasal e \"bunny lines\"", "part": "Parte 10 — Músculos e aplicação por região", "html": "<p>As rugas do nariz não são causadas apenas pelo músculo nasal; também participam o\n<strong>prócero</strong> e o <strong>LLSAN</strong>:\n- Linhas <strong>horizontais</strong> → principalmente o <strong>prócero</strong>.\n- Linhas <strong>verticais</strong> → principalmente o <strong>músculo nasal</strong>.\n- Linhas <strong>oblíquas</strong> → principalmente o <strong>LLSAN</strong>.</p>\n<hr />", "text": " As rugas do nariz não são causadas apenas pelo músculo nasal; também participam o\n prócero  e o  LLSAN :\n- Linhas  horizontais  → principalmente o  prócero .\n- Linhas  verticais  → principalmente o  músculo nasal .\n- Linhas  oblíquas  → principalmente o  LLSAN . \n "}, {"id": "33-fontes-citadas-no-material", "title": "Fontes citadas no material", "part": "Fontes citadas no material", "html": "<ul>\n<li>Costa et al. (estudo de HIS) — <em>citação parcial</em></li>\n<li>Cotofana et al. (2020) — linha de convergência</li>\n<li>Braz e Sakuma (2010) — padrões de contração frontal</li>\n<li>Zarins (2021) — origem e inserção dos músculos</li>\n<li>Goodman et al. (2021) — cuidado com o contato ósseo</li>\n<li>Cohen (2021) — intercorrência/necrose</li>\n<li>Polícia Civil RS (pc.rs.gov.br) — caso Israderm</li>\n</ul>", "text": " \n Costa et al. (estudo de HIS) —  citação parcial  \n Cotofana et al. (2020) — linha de convergência \n Braz e Sakuma (2010) — padrões de contração frontal \n Zarins (2021) — origem e inserção dos músculos \n Goodman et al. (2021) — cuidado com o contato ósseo \n Cohen (2021) — intercorrência/necrose \n Polícia Civil RS (pc.rs.gov.br) — caso Israderm \n "}], "groups": [{"part": "Parte 1 — Farmacologia e unidades", "items": [{"id": "01-1-1-unidades-americanas-e-unidades-speyw", "title": "1.1 Unidades Americanas e Unidades Speywood"}, {"id": "02-1-2-convers-o-da-dysport", "title": "1.2 Conversão da Dysport"}, {"id": "03-1-3-halo-de-a-o", "title": "1.3 Halo de ação"}, {"id": "04-1-4-a-dysport-mais-potente-ou-tem-maior-", "title": "1.4 A Dysport é mais potente ou tem maior halo de ação?"}]}, {"part": "Parte 2 — Reconstituição", "items": [{"id": "05-2-1-o-que", "title": "2.1 O que é"}, {"id": "06-2- 8-2-profundidade-da-aplica-o", "title": "8.2 Profundidade da aplicação"}]}, {"part": "Parte 9 — Avaliação clínica do paciente", "items": [{"id": "23-9-1-rugas-est-ticas-din-micas", "title": "9.1 Rugas estáticas × dinâmicas"}, {"id": "24-9-2-hipercin-tico-normocin-tico", "title": "9.2 Hipercinético × normocinético"}, {"id": "25-9-3-anest-sicos-t-picos-formula-es-de-la", "title": "9.3 Anestésicos tópicos — formulações de laboratório"}]}, {"part": "Parte 10 — Músculos e aplicação por região", "items": [{"id": "26-10-1-testa-m-sculo-occipitofrontal-ventr", "title": "10.1 Testa — músculo occipitofrontal (ventre frontal)"}, {"id": "27-10-2-glabela", "title": "10.2 Glabela"}, {"id": "28-10-3-periorbital-m-sculo-orbicular-do-ol", "title": "10.3 Periorbital — músculo orbicular do olho (\"pés de galinha\")"}, {"id": "29-10-4-m-sculos-zigom-ticos", "title": "10.4 Músculos zigomáticos"}, {"id": "30-10-5-p-lpebra-inferior", "title": "10.5 Pálpebra inferior"}, {"id": "31-10-6-l-bio-superior-e-sorriso-gengival", "title": "10.6 Lábio superior e sorriso gengival"}, {"id": "32-10-7-nariz-m-sculo-nasal-e-bunny-lines", "title": "10.7 Nariz — músculo nasal e \"bunny lines\""}]}, {"part": "Fontes citadas no material", "items": [{"id": "33-fontes-citadas-no-material", "title": "Fontes citadas no material"}]}], "consulta": {"doses": [["Testa (frontal)", "10–30 U / ponto", "45°", "1 cm da sobrancelha; 1–2 cm entre pontos"], ["Glabela", "20–50 U / ponto", "45° / 90°", "Nunca com a ponta voltada ao olho"], ["Periorbital (orbicular do olho)", "2–4 U / ponto", "45° / 90°", "Sobre base óssea; 1 cm / 1 dedo do olho"], ["Levantador do lábio / LLSAN", "10–20 U / ponto", "90°", "1 cm horizontal a partir da asa do nariz"]], "conversao": ["1 unidade americana = 2,5 unidades Speywood (Dysport)", "Dysport 300 ≈ 120 U americanas", "Dysport 500 ≈ 200 U americanas", "Equivalência recomendada: 2,5 : 1"], "links": [["Reconstituição (seca × tradicional)", "reconstitui"], ["Contagem nas seringas (30U/50U/100U)", "seringa"], ["Marcas autorizadas no Brasil", "marca"], ["Suplementação (Fitase e Zinco)", "suplementa"]]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const PAGES=D.pages, GROUPS=D.groups, CONS=D.consulta;
const byId=Object.fromEntries(PAGES.map(p=>[p.id,p]));
const order=PAGES.map(p=>p.id);
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const KEY='tb_progress';
let done=JSON.parse(localStorage.getItem(KEY)||'{}');
const saveDone=()=>localStorage.setItem(KEY,JSON.stringify(done));

function buildNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  GROUPS.forEach(g=>{
    if(g.part){const h=document.createElement('div');h.className='grp';h.textContent=g.part;nav.appendChild(h);}
    g.items.forEach(it=>{
      const a=document.createElement('a');a.dataset.id=it.id;
      a.innerHTML='<span class="dot"></span><span class="lbl">'+it.title+'</span>';
      a.onclick=()=>show(it.id);nav.appendChild(a);
    });
  });
  // item "Início" no topo (antes dos grupos)
  const a=document.createElement('a');a.dataset.id='inicio';
  a.innerHTML='<span class="dot"></span><span class="lbl">Início</span>';
  a.onclick=()=>show('inicio');nav.insertBefore(a,nav.firstChild);
  refreshNav();
}
function refreshNav(){
  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('done',!!done[a.dataset.id]);
  });
  const total=PAGES.length,d=PAGES.filter(p=>done[p.id]).length;
  document.getElementById('prog').innerHTML='Progresso: <b>'+d+'/'+total+'</b>';
}
function setActive(id){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));}

let current=null;
function show(id){
  const p=byId[id];if(!p)return;current=id;
  const i=order.indexOf(id);
  const prev=order[i-1],next=order[i+1];
  const m=document.getElementById('main');
  m.innerHTML=
    '<article>'+
    (p.part?'<div class="crumb">'+p.part+'</div>':'')+
    '<h1 class="t">'+p.title+'</h1>'+
    '<span class="markme'+(done[id]?' on':'')+'" id="mark">'+
      '<span>'+(done[id]?'✓ Lido':'Marcar como lido')+'</span></span>'+
    '<div class="content">'+p.html+'</div>'+
    '</article>'+
    '<div class="nextprev">'+
    '<button '+(prev?'':'disabled')+' id="bprev">'+(prev?'<small>Anterior</small>'+byId[prev].title:'')+'</button>'+
    '<button '+(next?'':'disabled')+' id="bnext">'+(next?'<small>Próximo</small>'+byId[next].title:'')+'</button>'+
    '</div>';
  document.getElementById('mark').onclick=()=>{done[id]=!done[id];saveDone();refreshNav();show(id);};
  if(prev)document.getElementById('bprev').onclick=()=>show(prev);
  if(next)document.getElementById('bnext').onclick=()=>show(next);
  setActive(id);window.scrollTo(0,0);closeAside();
  const q=document.getElementById('search').value.trim();if(q)highlight(q);
}

function showConsulta(){
  current=null;setActive('');
  let doses='<table><thead><tr><th>Região</th><th>Dose média*</th><th>Ângulo</th><th>Observação</th></tr></thead><tbody>'+
    CONS.doses.map(r=>'<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+
    '</tbody></table>';
  let conv='<ul>'+CONS.conversao.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  let links=CONS.links.map(l=>'<span class="qlink" data-q="'+l[1]+'">'+l[0]+'</span>').join('');
  document.getElementById('main').innerHTML=
    '<div class="cards">'+
    '<div class="card"><h3>⚡ Consulta rápida</h3><p style="color:var(--muted);margin:0">Atalhos para os dados mais usados. Toque num atalho para abrir o capítulo completo.</p></div>'+
    '<div class="card"><h3>Doses por região</h3>'+doses+'<p style="font-size:12px;color:var(--muted)">*Valores médios extraídos do material — <b>confira no original antes de aplicar</b>.</p></div>'+
    '<div class="card"><h3>Conversão de unidades</h3>'+conv+'</div>'+
    '<div class="card warn"><h3>Ir para tabelas completas</h3>'+links+'</div>'+
    '</div>';
  document.querySelectorAll('.qlink').forEach(el=>el.onclick=()=>{
    const t=norm(el.dataset.q);const hit=PAGES.find(p=>norm(p.title).includes(t));if(hit)show(hit.id);
  });
  window.scrollTo(0,0);closeAside();
}

function highlight(q){
  const nq=norm(q);if(!nq)return;
  document.querySelectorAll('.content').forEach(c=>{
    const walk=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);const nodes=[];
    while(walk.nextNode())nodes.push(walk.currentNode);
    nodes.forEach(n=>{
      if(norm(n.nodeValue).includes(nq)&&n.parentNode){
        const span=document.createElement('span');
        span.innerHTML=n.nodeValue.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
        n.parentNode.replaceChild(span,n);
      }
    });
  });
}

function doSearch(){
  const q=document.getElementById('search').value.trim();const nq=norm(q);
  document.querySelectorAll('.nav a').forEach(a=>{
    const p=byId[a.dataset.id];const hit=!nq||norm(p.title).includes(nq)||norm(p.text).includes(nq);
    a.classList.toggle('hidden',!hit);
  });
  if(current)highlight(q);
}

function closeAside(){document.getElementById('aside').classList.remove('open');}
document.getElementById('menuBtn').onclick=()=>document.getElementById('aside').classList.toggle('open');
document.getElementById('quickBtn').onclick=showConsulta;
document.getElementById('search').addEventListener('input',doSearch);

buildNav();showConsulta();
</script>
</body></html>

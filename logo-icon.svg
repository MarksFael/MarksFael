<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Portal do Curso icon">
  <title>Portal do Curso — icon</title>
  <defs>
    <linearGradient id="playGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="playInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="capBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Play button -->
  <path d="M 38 65
           L 152 116
           Q 165 121 152 127
           L 38 178
           Q 24 178 24 164
           L 24 79
           Q 24 65 38 65 Z"
        fill="url(#playGrad)"/>

  <!-- Inner play highlight -->
  <path d="M 56 90
           L 122 119
           Q 130 122 122 125
           L 56 154
           Q 48 154 48 148
           L 48 96
           Q 48 90 56 90 Z"
        fill="url(#playInner)" opacity="0.9"/>

  <!-- Cap band -->
  <path d="M 80 80
           L 178 80
           L 170 100
           Q 128 109 88 100 Z"
        fill="url(#capBand)"/>

  <!-- Mortarboard -->
  <path d="M 128 32
           L 196 64
           L 128 96
           L 60 64 Z"
        fill="url(#capTop)"/>

  <!-- Mortarboard highlight -->
  <path d="M 128 38
           L 187 64
           L 128 90
           L 69 64 Z"
        fill="#60A5FA" opacity="0.3"/>

  <!-- Tassel button -->
  <circle cx="184" cy="64" r="3.8" fill="#FBBF24"/>
  <!-- Tassel cord -->
  <path d="M 184 67 Q 190 82 185 98"
        stroke="#FBBF24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tassel tuft -->
  <path d="M 178 98 L 185 117 L 192 98 Z" fill="#FBBF24"/>
  <path d="M 181 100 L 185 115 M 185 100 L 185 116 M 189 100 L 185 115"
        stroke="#F59E0B" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>
